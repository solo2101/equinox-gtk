name: Validate Marco Themes

on:
  push:
    branches: [main]
    paths:
      - 'themes/**/metacity-1/metacity-theme-1.xml'
      - 'scripts/check-marco-theme.py'
      - '.github/workflows/marco-theme.yml'
  pull_request:
    paths:
      - 'themes/**/metacity-1/metacity-theme-1.xml'
      - 'scripts/check-marco-theme.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate XML and required frame button states
        run: python3 scripts/check-marco-theme.py
      - name: Install Marco and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends marco xvfb xauth dbus-x11
      - name: Install themes for test user
        run: bash scripts/install-user-themes.sh
      - name: Load themes with the actual Marco renderer
        shell: bash
        run: |
          set -euo pipefail
          for theme in Equinox-Evolution Equinox-Evolution-Dawn Equinox-Evolution-Dusk Equinox-Light Equinox-Evolution-Midnight; do
            log="$(mktemp)"
            set +e
            timeout 10s xvfb-run -a marco-theme-viewer "$theme" >"$log" 2>&1
            status=$?
            set -e
            cat "$log"
            # GTK prints unrelated CSS "Theme parsing error" warnings when
            # running under Xvfb. Those are not Marco window-frame failures.
            # Check only actual Marco loader rejections.
            if grep -Eiq '^(Error loading theme:|Failed to load theme:|Error parsing Metacity theme:)' "$log"; then
              echo "::error::Marco renderer rejected $theme"
              exit 1
            fi
            if [[ "$status" -ne 0 && "$status" -ne 124 ]]; then
              echo "::error::Marco theme viewer failed for $theme (exit $status)"
              exit 1
            fi
            echo "Marco renderer accepted $theme (exit $status)"
            rm -f "$log"
          done
