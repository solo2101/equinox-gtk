# Optional archival reference only. NEVER overwrite actively maintained
# Equinox Marco themes with upstream artwork.
name: Archive original Equinox 1.50 Marco reference

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-original:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download checksum-verified original Equinox themes
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/140449-equinox-themes-1.50.tar.gz"
          urls=(
            "https://distcache.freebsd.org/ports-distfiles/140449-equinox-themes-1.50.tar.gz"
            "https://ftp.ec-m.fr/pub/OpenBSD/distfiles/140449-equinox-themes-1.50.tar.gz"
            "https://mirrors.nju.edu.cn/freebsd-ports/distfiles/140449-equinox-themes-1.50.tar.gz"
          )
          ok=0
          for url in "${urls[@]}"; do
            if curl --fail --location --retry 2 --connect-timeout 10 --max-time 45 \
                --output "$archive" "$url"; then
              if echo "32b3cedfbc27e466289aa8a0b6d1f3f964a553956d94bf267bd42c749691823c  $archive" | sha256sum --check -; then
                ok=1
                break
              fi
            fi
          done
          test "$ok" -eq 1
          echo "EQUINOX_ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Unpack original Metacity reference in temporary directory
        run: |
          python3 scripts/import-original-marco.py "$EQUINOX_ARCHIVE" --destination "$RUNNER_TEMP/Equinox-Original-Reference"
      - uses: actions/upload-artifact@v4
        with:
          name: original-equinox-metacity-reference
          path: ${{ runner.temp }}/Equinox-Original-Reference
