name: Validate GTK3 CSS

on:
  push:
    branches: [main]
    paths:
      - 'themes/**/gtk-3.0/gtk.css'
      - 'scripts/check-gtk3-css.py'
      - '.github/workflows/gtk3-css.yml'
  pull_request:
    paths:
      - 'themes/**/gtk-3.0/gtk.css'
      - 'scripts/check-gtk3-css.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  css-parse:
    runs-on: ubuntu-latest
    container:
      image: fedora:43
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK3 parser dependencies
        run: dnf install -y gtk3 python3
      - name: Parse Equinox light and dark GTK3 CSS
        run: python3 scripts/check-gtk3-css.py
