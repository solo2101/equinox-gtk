name: Validate GTK3 CSS and previews

on:
  push:
    branches: [main]
    paths:
      - 'themes/**/gtk-3.0/gtk.css'
      - 'scripts/check-gtk3-css.py'
      - 'scripts/preview-gtk3-menus.py'
      - 'scripts/preview-gtk3-dialogs.py'
      - 'scripts/preview-gtk3-tooltips-scrollbars.py'
      - 'scripts/preview-gtk3-caja-focus.py'
      - 'scripts/preview-gtk3-panel.py'
      - '.github/workflows/gtk3-css.yml'
  pull_request:
    paths:
      - 'themes/**/gtk-3.0/gtk.css'
      - 'scripts/check-gtk3-css.py'
      - 'scripts/preview-gtk3-menus.py'
      - 'scripts/preview-gtk3-dialogs.py'
      - 'scripts/preview-gtk3-tooltips-scrollbars.py'
      - 'scripts/preview-gtk3-caja-focus.py'
      - 'scripts/preview-gtk3-panel.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  css-parse:
    runs-on: ubuntu-latest
    container:
      image: fedora:43
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK3 parser and preview dependencies
        run: dnf install -y gtk3 python3 python3-gobject
      - name: Parse all five Equinox GTK3 stylesheets
        run: python3 scripts/check-gtk3-css.py
      - name: Check GTK3 preview scripts
        run: |
          python3 -m py_compile scripts/preview-gtk3-menus.py scripts/preview-gtk3-dialogs.py scripts/preview-gtk3-tooltips-scrollbars.py scripts/preview-gtk3-caja-focus.py scripts/preview-gtk3-panel.py
          python3 -c "import runpy; runpy.run_path('scripts/preview-gtk3-menus.py', run_name='syntax_check'); runpy.run_path('scripts/preview-gtk3-dialogs.py', run_name='syntax_check'); runpy.run_path('scripts/preview-gtk3-tooltips-scrollbars.py', run_name='syntax_check'); runpy.run_path('scripts/preview-gtk3-caja-focus.py', run_name='syntax_check'); runpy.run_path('scripts/preview-gtk3-panel.py', run_name='syntax_check')"
